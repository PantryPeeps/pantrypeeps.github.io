  <script>
  fetch('/assets/hubs.json?v=20261117-4').then(r=>r.json()).then(hubs=>{const grid=document.querySelector('#hub-grid');for(const hub of hubs){const a=document.createElement('a');a.className='hub-card';a.href=hub.path;const img=document.createElement('img');img.src='/assets/icons/'+hub.icon;img.alt='';img.loading='lazy';const title=document.createElement('span');title.className='hub-title';title.textContent=hub.title;const desc=document.createElement('span');desc.className='hub-description';desc.textContent=hub.desc;a.append(img,title,desc);grid.append(a);}});
