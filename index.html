  <title>Pantry Peeps | Stretch your budget. Fill a pantry. Feed a belly.</title>
  <link rel="stylesheet" href="/assets/nav.css">
  <style>
  :root{--ink:#101e28;--cyan:#00cced;--yellow:#ffeb26;--paper:#f3f7f8;--muted:#425663;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}.hero{padding:clamp(34px,6vw,72px) 0 25px}.eyebrow{font-weight:850;text-transform:uppercase;letter-spacing:.08em;color:#00647a;font-size:.83rem}.hero h1{font-size:clamp(2.5rem,7vw,5.1rem);line-height:.98;letter-spacing:-.065em;margin:10px 0 15px}.hero p{max-width:54ch;font-size:1.1rem;line-height:1.55;color:var(--muted);margin:0}.hubs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px 17px;padding:10px 0 58px}.hub-card{position:relative;background:white;text-decoration:none;color:var(--ink);border:1px solid #c9d5da;border-radius:16px;padding:18px 13px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;min-height:260px;box-shadow:0 4px 12px #10212a0d;transition:transform .18s,box-shadow .18s}.hub-card:hover,.hub-card:focus-visible{transform:translateY(-4px);box-shadow:0 10px 24px #10212a1c;outline:3px solid #007f99;outline-offset:2px}.hub-card img{width:min(100%,140px);aspect-ratio:1;object-fit:cover;border-radius:50%;display:block}.hub-title{font-size:1.02rem;font-weight:850;line-height:1.2;margin:12px 0 0}.hub-description{margin:8px 0 0;color:var(--muted);font-size:.86rem;line-height:1.42}.footer{margin-top:0}@media(min-width:781px) and (hover:hover){.hub-description{position:absolute;left:12px;right:12px;top:48%;transform:translateY(0);background:var(--ink);color:white;padding:11px;border-radius:10px;opacity:0;visibility:hidden;z-index:2;box-shadow:0 7px 18px #0004}.hub-card:hover .hub-description,.hub-card:focus-visible .hub-description{opacity:1;visibility:visible}.hub-card:hover .hub-title,.hub-card:focus-visible .hub-title{color:#00647a}}@media(max-width:780px){.hubs{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}.hub-card{min-height:0;padding:13px 10px 15px;min-height:48px}.hub-card img{width:min(100%,150px)}.hero{padding-top:34px}}@media(max-width:780px),(hover:none){.hub-description{position:static!important;display:block!important;visibility:visible!important;opacity:1!important;transform:none!important;font-size:.81rem;background:transparent;color:var(--muted);box-shadow:none;padding:0;border-radius:0}}@media(max-width:360px){.hub-title{font-size:.92rem}.hub-description{font-size:.75rem}}
  </style>
  <script defer src="/assets/nav.js"></script>
</head>
<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K5XGZSQT" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <main class="wrap">
    <section class="hero"><div class="eyebrow">Western New York • 716 LFPC</div><h1>Pantry Peeps</h1><p>Stretch your budget. Fill a pantry. Feed a belly. Pick a hub to find deals, practical resources, and ways to support your community.</p></section>
    <nav class="hubs" aria-label="Explore all Pantry Peeps hubs" id="hub-grid"></nav>
  </main>
  <script>
  fetch('/assets/hubs.json').then(r=>r.json()).then(hubs=>{const grid=document.querySelector('#hub-grid');for(const hub of hubs){const a=document.createElement('a');a.className='hub-card';a.href=hub.path;const img=document.createElement('img');img.src='/assets/icons/'+hub.icon;img.alt='';img.loading='lazy';const title=document.createElement('span');title.className='hub-title';title.textContent=hub.title;const desc=document.createElement('span');desc.className='hub-description';desc.textContent=hub.desc;a.append(img,title,desc);grid.append(a);}});
  </script>
</body>
</html>
