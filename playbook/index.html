  <style>
  :root{--ink:#101e28;--cyan:#00cced;--yellow:#ffeb26;--paper:#f3f7f8;--muted:#425663;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.5}.page{width:min(940px,calc(100% - 32px));margin:0 auto;padding:24px 0 54px}h1{margin:0;font-size:clamp(2rem,6vw,3.6rem);line-height:1.04;letter-spacing:-.06em}.feature{margin-top:18px;background:#fff;border:1px solid #c9d5da;border-radius:14px;padding:clamp(17px,3vw,26px)}.feature h2{margin:0 0 12px;line-height:1.15;letter-spacing:-.035em}.feature p{max-width:70ch}.app-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;margin:20px 0}.app-card{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;min-width:0;border:1px solid #bccbd1;border-radius:12px;padding:16px;background:#f7fdfe}.app-card h3{margin:0;font-size:1.1rem}.app-description{margin:6px 0;color:var(--muted);font-size:.88rem;line-height:1.4}.app-code{font-size:.9rem;margin:7px 0;color:var(--ink)}.copy-referral{font:inherit;font-weight:800;border:1px solid var(--ink);border-radius:7px;background:var(--yellow);padding:8px 11px;cursor:pointer}.copy-referral:hover{background:var(--cyan)}.qr-card{display:grid;justify-items:center;gap:4px;padding:7px;background:#fff;border:8px solid white;outline:1px solid #d6e0e4;border-radius:7px;color:var(--ink);font-size:.76rem;font-weight:750;text-decoration:none}.qr-svg{display:block;width:102px;height:102px;background:white}.guide-blank{min-height:30px}.food-hack-image{display:block;width:min(100%,720px);height:auto;margin:8px auto 0}.back-deals{display:inline-flex;margin-top:18px;min-height:46px;align-items:center;justify-content:center;padding:9px 15px;border-radius:9px;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);font-weight:850;text-decoration:none}.back-deals:hover{background:var(--cyan)}@media(hover:hover){.app-description{display:none}.app-card:hover .app-description,.app-card:focus-within .app-description{display:block}}@media(max-width:780px){.app-list{grid-template-columns:1fr;gap:24px}.app-description{display:block}.app-card{gap:16px}.qr-svg{width:106px;height:106px}}@media(max-width:390px){.app-card{grid-template-columns:1fr auto;padding:12px;gap:10px}.qr-svg{width:92px;height:92px}}@media print{.pp-nav,.pp-footer,.pp-top,.copy-referral,.back-deals{display:none!important}.app-description{display:block!important}}

  <main class="page">
    <h1>The Pantry Playbook</h1>
    <section class="feature" id="rebate-referrals">
      <h2>Rebate apps, referral codes &amp; QR cards</h2>
      <p>These are my referral codes; I may receive a bonus if you join or complete a qualifying action.</p>
      <div class="app-list" id="playbook-app-list"></div>
      <a class="back-deals" href="/deals/">← Back to Today’s Deals</a>

    <section class="feature" id="pantry-stretching-guide">
      <h2>Pantry Stretching Guide</h2>

      <img class="food-hack-image" src="/assets/flyers/mayo-packets.svg" alt="Save Those Mayo Packets flyer">

  <script>
  (()=>{const apps=[{name:'Ibotta',code:'jshatux',url:'https://ibotta.onelink.me/iUfE/8cc13c64?friend_code=jshatux',desc:'Cash back on everyday grocery & household items.',hasCode:true},{name:'Fetch',code:'J6GNX',url:'https://fetch.com/referral',desc:'Snap any receipt from any store for gift card points.',hasCode:true},{name:'Receipt Hog',code:'kon91426',url:'https://www.receipthog.com/',desc:'Earn coins and spins from every paper or digital receipt.',hasCode:true},{name:'Upside',code:'MJ4484',url:'https://www.upside.com/',desc:'Instant cash back on gas, groceries, and restaurants.',hasCode:true},{name:'Checkout 51',code:'',url:'https://www.checkout51.com/',desc:'Weekly cash-back offers on groceries and gas.',hasCode:false}];const host=document.querySelector('#playbook-app-list');for(const app of apps){const card=document.createElement('article');card.className='app-card';const qr='https://api.qrserver.com/v1/create-qr-code/?format=svg&size=180x180&margin=8&data='+encodeURIComponent(app.url);const left=document.createElement('div');left.innerHTML='<h3>'+app.name+'</h3><p class="app-description">'+app.desc+'</p>'+(app.hasCode?'<p class="app-code">Code: <strong>'+app.code+'</strong></p><button type="button" class="copy-referral" data-copy="'+app.code+'">Copy Code</button>':'<p class="app-code">Cash-back offers</p>');const link=document.createElement('a');link.className='qr-card';link.href=app.url;link.target='_blank';link.rel='noopener';link.setAttribute('aria-label','Open '+app.name+(app.hasCode?' with referral code '+app.code:''));link.innerHTML='<svg class="qr-svg" viewBox="0 0 180 180" role="img" aria-label="QR code for '+app.name+'"><image href="'+qr+'" width="180" height="180"/></svg><span>Tap or scan</span>';card.append(left,link);host.append(card)}document.addEventListener('click',async e=>{const button=e.target.closest('.copy-referral');if(!button)return;try{await navigator.clipboard.writeText(button.dataset.copy)}catch{const field=document.createElement('textarea');field.value=button.dataset.copy;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();document.execCommand('copy');field.remove()}button.textContent='Copied!';setTimeout(()=>button.textContent='Copy Code',1500)})})();
  </script>
